name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ElevenClients/ElevenClients
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
          build-root-directory: ElevenClients/ElevenClients
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: ElevenClients
          path: |
            ElevenClients/ElevenClients/build/libs/*.jar
            !ElevenClients/ElevenClients/build/libs/*-sources.jar
